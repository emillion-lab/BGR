name: Patch

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which patch to apply"
        type: choice
        default: all
        options:
          - all
          - patch_search.py
          - patch_deeplink.py

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply patch
        run: |
          set -e
          if [ "${{ inputs.script }}" = "all" ]; then
            for f in scripts/patch_*.py; do
              echo "── $f"
              python3 "$f"
            done
          else
            python3 "scripts/${{ inputs.script }}"
          fi

      - name: Validate JS syntax
        run: |
          set -e
          python3 - <<'PY'
          import re, io
          s = io.open('index.html', encoding='utf-8').read()
          n = 0
          for m in re.finditer(r'<script[^>]*>(.*?)</script>', s, re.S):
              io.open('_chk%d.js' % n, 'w', encoding='utf-8').write(m.group(1))
              n += 1
          print('script blocks:', n)
          PY
          for f in _chk*.js; do node --check "$f" && echo "$f OK"; done
          rm -f _chk*.js

      - name: Commit
        run: |
          git config user.name "gh-admin"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no changes — patches were already applied"
            exit 0
          fi
          git commit -m "BGR: apply ${{ inputs.script }}"
          git push
